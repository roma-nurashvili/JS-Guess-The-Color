<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guess The Color</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="logo.png" type="image/x-icon">
  </head>
  <body>
    <div class="container">
      <header>
        <a class="logo" href="index.html">
          <img src="logo.png" alt="logo" />
          <p>Guess The Color</p>
        </a>
        <h1 class="pointsh1">Points: <b id="pointCount">0</b></h1>
      </header>
      <main>
        <h1 id="colorCode" class="colorCode"></h1>
        <div id="colorBox" class="colorBox"></div>
        <button id="mainBtn" class="mainBtn" onclick="startGame()">Start Game</button>
        <div id="modeBtn" class="modeBtn">
          <button onclick="randomizer(3)" class="mode easy">Easy</button>
          <button onclick="randomizer(6)" class="mode hard">Hard</button>
          <button onclick="randomizer(9)" class="mode expert">Expert</button>
        </div>
        <button id="resetBtn" class="resetBtn" onclick="startGame()">Reset</button>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
